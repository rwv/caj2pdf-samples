name: Catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check catalog structure (no corpus download)
        run: python3 tools/check_catalog.py
      - name: Test the checker
        run: python3 -m unittest discover -s tests -v
      - name: Install external PDF tools for original controls
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils qpdf
      - name: Test research identity parsers (no corpus download)
        env:
          PYTHONPATH: research/scripts
        run: |
          python3 -m unittest discover -s research/conformance -p 'test_hnc8_layout_source.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_native_text_order.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_current_format_order.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_github_bitmap_oracle.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_hnc8_outline_inventory.py' -v
      - name: Test original PDF payload audit controls (no corpus download)
        run: |
          python3 -m pip install 'pikepdf==10.5.1'
          python3 -m unittest discover -s research/conformance -p 'test_indexed_lookup_audit.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_ttkn_payload_boundary.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_source_image_geometry.py' -v
