name: Catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check catalog structure (no corpus download)
        run: python3 tools/check_catalog.py
      - name: Test the checker
        run: python3 -m unittest discover -s tests -v
      - name: Install external PDF tools for original controls
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils qpdf qtbase5-dev g++
      - name: Test research identity parsers (no corpus download)
        env:
          PYTHONPATH: research/scripts
        run: |
          python3 -m unittest discover -s research/conformance -p 'test_hnc8_layout_source.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_native_text_order.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_current_format_order.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_github_bitmap_oracle.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_hnc8_outline_inventory.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_teb_inventory.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_teb_credentials.py' -v
      - name: Test original PDF payload audit controls (no corpus download)
        run: |
          python3 -m pip install 'pikepdf==10.5.1'
          python3 -m unittest discover -s research/conformance -p 'test_indexed_lookup_audit.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_ttkn_payload_boundary.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_source_image_geometry.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_native_vector_geometry.py' -v
      - name: Test original PDF-family preservation controls (no corpus download)
        env:
          PYTHONPATH: research/scripts
        run: python3 -m unittest discover -s research/conformance -p 'test_pdf_source_*.py' -v
      - name: Test original native composition controls (no viewer or corpus download)
        run: |
          c++ -std=c++17 -shared -fPIC -O2 -Wall -Wextra -Werror -DQT_NO_VERSION_TAGGING $(pkg-config --cflags Qt5Gui) research/cajviewer/qpaint_observe.cpp -ldl -o /tmp/qpaint-observe.so
          python3 -m pip install 'Pillow==11.1.0' 'numpy==2.2.4' 'scipy==1.15.2' 'PyMuPDF==1.27.2.2' 'fonttools==4.62.1'
          python3 -m unittest discover -s research/conformance -p 'test_native_composition_inventory.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_native_page_capture.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_native_navigation_controls.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_pdf_navigation_controls.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_pdf_raster_stage_controls.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_pdf_rgb_controls.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_raster_rgb_comparison.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_pdf_page_box_controls.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_page_box_observation.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_raster_gray_comparison.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_qimage_buffer_observe.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_qtree_observe.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_outline_capture.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_native_raster_comparison.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_composition_marker_fonts.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_native_glyph_geometry.py' -v
          python3 -m unittest discover -s research/conformance -p 'test_native_font_subsets.py' -v
